# Ivy configuration — tunable by the weekly retro (learn: commits)
login: tompulsarlabs
timezone: Europe/Berlin

# Commit identity for failsafe commits. MUST stay a GitHub-connected address
# (rule 2 in DESIGN.md §1). The noreply form is guaranteed-connected.
commit_email: 249609836+tompulsarlabs@users.noreply.github.com
commit_name: tompulsarlabs

schedule:            # local times in `timezone`; nothing after 22:30 (midnight margin)
  scout: "09:00"
  check: "18:00"
  failsafe: "22:30"
  retro: "SUN 10:00"

watchlist:
  source: auto       # scout syncs from `gh api user/repos`; forks + archived excluded
  exclude: []        # manual opt-outs by full name, e.g. tompulsarlabs/scratch
  repos:             # synced 2026-08-24 — 11 repos, 0 forks, 0 archived, 0 excluded
    - tompulsarlabs/talent-scout
    - tompulsarlabs/margaux-en-tutor
    - tompulsarlabs/c2-client-matrix
    - tompulsarlabs/ai-capability-app
    - tompulsarlabs/writing-voice-skill
    - tompulsarlabs/aris-ote-benchmarking
    - tompulsarlabs/Dex
    - tompulsarlabs/interview-ace
    - tompulsarlabs/ai-interview-coach
    - tompulsarlabs/bd-lead-comp-dashboard
    - tompulsarlabs/ivy

notifications:
  quiet_when_green: true
  nudge_style: concrete-candidate   # always name one specific next action

local_wip:            # scanned by scripts/local-wip.sh (launchd, 08:45 + 17:45)
  roots:
    - ~/Build
