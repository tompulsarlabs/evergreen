# Ivy configuration — tunable by the weekly retro (learn: commits)
login: tompulsarlabs
timezone: Europe/Berlin

# Commit identity for failsafe commits. MUST stay a GitHub-connected address
# (rule 2 in DESIGN.md §1). The noreply form is guaranteed-connected.
commit_email: 249609836+tompulsarlabs@users.noreply.github.com
commit_name: tompulsarlabs

schedule:            # local times in `timezone`; nothing after 22:30 (midnight margin)
  scout: "09:00"
  check: "18:00"
  failsafe: "22:30"
  retro: "SUN 10:00"

watchlist:
  source: auto       # scout syncs from `gh api user/repos`; forks + archived excluded
  exclude: []        # manual opt-outs by full name, e.g. tompulsarlabs/scratch
  repos:             # synced 2026-08-29 — 15 repos, 0 forks, 0 archived, 0 excluded (+yeva, new 2026-08-28)
    - tompulsarlabs/talent-scout
    - tompulsarlabs/talent-radar
    - tompulsarlabs/BrightPaws
    - tompulsarlabs/c2-client-matrix
    - tompulsarlabs/ai-capability-app
    - tompulsarlabs/writing-voice-skill
    - tompulsarlabs/aris-ote-benchmarking
    - tompulsarlabs/Dex
    - tompulsarlabs/tomgreen.ai
    - tompulsarlabs/interview-ace
    - tompulsarlabs/yeva
    - tompulsarlabs/ai-interview-coach
    - tompulsarlabs/bd-lead-comp-dashboard
    - tompulsarlabs/countersign
    - tompulsarlabs/ivy

notifications:
  quiet_when_green: true
  nudge_style: concrete-candidate   # always name one specific next action

local_wip:            # scanned by scripts/local-wip.sh (launchd, 08:45 + 17:45)
  roots:
    - ~/Build

lanes:               # coarse tiers -> concrete (harness, model, settings); data, retro-tunable
  frontier:
    anthropic: { harness: claude-code, model: claude-opus-5, effort: xhigh }
    openai:    { harness: codex, model: gpt-5.6-sol }    # pinned 2026-08-28: quality-first flagship tier
  workhorse:
    anthropic: { harness: claude-code, model: claude-opus-5, effort: medium }
    openai:    { harness: codex, model: gpt-5.6-terra }  # pinned 2026-08-28: balanced tier (luna = high-throughput, unused)
  fast-cheap:
    anthropic: { harness: claude-code, model: claude-haiku-4-5, effort: low }

pools:               # subscription auth lives on the Mac only, never in the cloud sandbox
  anthropic: { auth: mac-local }
  openai:    { auth: mac-local }   # Codex CLI on the Max subscription (flat-rate)

dispatch:            # decided 2026-08-27 (dispatch/DESIGN.md §10)
  daily_cap: 6                    # contracts created per day, all lanes
  runner_window: "09:15-21:00"    # Mac runner, every 30 min; clear of failsafe + midnight margin
  worker_pr: draft                # workers open draft PRs; promotion is a human act
  expires_default_hours: 48
